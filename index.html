<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" 
content="width=device-width, 
initial-scale=1.0">
<title>BTS</title>
<style>
body { 
margin:0; padding:15px; 
font-family:monospace; 
background:#0b1d12; 
color:#39ff14;
}
button { 
background:#ff3b30; 
color:#fff; border:none; 
padding:8px; width:100%; 
margin-bottom:15px; 
font-weight:bold;
}
.box { 
border:1px solid #1e4d31; 
padding:10px; 
margin-bottom:15px; 
background:#143521;
}
table { 
width:100%; 
border-collapse:collapse; 
}
td, th { 
padding:6px; 
text-align:left; 
border-bottom:
1px solid #1e4d31; 
font-size:12px;
}
</style>
</head>
<body>
<h2>BTS-pointer</h2>
<div class="box" id="gps">
[SYS] In attesa del GPS...
</div>
<button onclick="aggiungi()">
+ AGGIUNGI PUNTO (TAP)
</button>
<div class="box">
<h3>Puntamenti</h3>
<div id="tabella">
Nessun punto inserito.
</div>
</div>
<button style="background:#444" 
onclick="svuota()">
Svuota Memoria
</button>
<script>
let latA = 46.1314;
let lngA = 9.5691;
let altA = 262;
let punti = [];

punti = JSON.parse(
localStorage.getItem('bts_p')
) || [];

if (navigator.geolocation) {
navigator.geolocation.watchPosition(
function(pos) {
latA = pos.coords.latitude;
lngA = pos.coords.longitude;
altA = pos.coords.altitude || 262;
document.getElementById('gps').
innerHTML = `[OK] GPS Attivo<br>
Lat: ${latA.toFixed(4)}<br>
Lng: ${lngA.toFixed(4)}`;
calcola();
}, function() {
document.getElementById('gps').
innerHTML = `[ERR] GPS Demo`;
calcola();
}, {enableHighAccuracy:true});
}

function aggiungi() {
const n = prompt("Nome BTS:");
if (!n) return;
const laStr = prompt("Latitudine (es: 46.2123):");
const lnStr = prompt("Longitudine (es: 9.4297):");
const alStr = prompt("Altitudine (m s.l.m.):", "0");
const latB = parseFloat(laStr);
const lngB = parseFloat(lnStr);
const altB = parseFloat(alStr) || 0;
if (isNaN(latB) || isNaN(lngB)) {
alert("Coordinate errate!");
return;
}
punti.push({
nome: n, lat: latB, 
lng: lngB, alt: altB
});
localStorage.setItem('bts_p', 
JSON.stringify(punti));
calcola();
}

function calcola() {
if (punti.length === 0) return;
let h = `<table><tr>
<th>Nome</th><th>Dist</th>
<th>Azimut</th><th>Elev</th>
</tr>`;
punti.forEach(p => {
const dLat = (p.lat - latA) * 
Math.PI / 180;
const dLng = (p.lng - lngA) * 
Math.PI / 180;
const l1 = latA * Math.PI / 180;
const l2 = p.lat * Math.PI / 180;
const a = Math.sin(dLat/2) * 
Math.sin(dLat/2) + Math.sin(dLng/2) * 
Math.sin(dLng/2) * Math.cos(l1) * 
Math.cos(l2);
const c = 2 * Math.atan2(
Math.sqrt(a), Math.sqrt(1-a)
);
const d = 6371000 * c;
const y = Math.sin(dLng) * 
Math.cos(l2);
const x = Math.cos(l1) * 
Math.sin(l2) - Math.sin(l1) * 
Math.cos(l2) * Math.cos(dLng);
let az = (Math.atan2(y, x) * 
180 / Math.PI + 360) % 360;
let el = Math.atan2(p.alt - altA, d) * 
180 / Math.PI;
h += `<tr>
<td><b>${p.nome}</b></td>
<td>${(d/1000).toFixed(1)}km</td>
<td>${az.toFixed(1)}°</td>
<td>${el.toFixed(1)}°</td>
</tr>`;
});
h += `</table>`;
document.getElementById('tabella').
innerHTML = h;
}

function svuota() {
if (confirm("Cancellar tutto?")) {
localStorage.removeItem('bts_p');
location.reload();
}
}
calcola();
</script>
</body>
</html>
